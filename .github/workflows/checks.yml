name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Check source and run addon tests
        run: python3 scripts/check.py
      - name: Build without uploading
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -g forever
      - name: Validate ZIP and write checksums
        run: python3 scripts/artifact.py create
      - uses: actions/upload-artifact@v7
        with:
          name: addon-${{ github.sha }}
          path: |
            .release/*.zip
            .release/release.json
          if-no-files-found: error
          include-hidden-files: true
