name: Publish existing release to CurseForge
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.1.0-alpha.1
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: curseforge-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  upload:
    if: vars.CURSEFORGE_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: curseforge
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download existing release
        run: |
          set -euo pipefail
          python3 scripts/check.py --version "$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --pattern '*.zip' --pattern release.json --dir .release
          gh release view "$RELEASE_TAG" --json body --jq .body > .release/notes.md
      - name: Verify and upload the existing ZIP
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PUBLISH: '1'
        run: python3 scripts/publish.py
