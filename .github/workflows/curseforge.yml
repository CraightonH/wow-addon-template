name: Publish existing release to CurseForge
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.1.0-alpha.1
        required: true
        type: string
permissions:
  contents: write
jobs:
  upload:
    if: vars.CURSEFORGE_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/reusable-curseforge.yml
    with:
      tooling-ref: workflows-v1.0.1
      tag: ${{ inputs.tag }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
